name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: macOS ships 3.9.6, which is what SwiftBar
        # typically ends up running the plugin with.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest test_claude_usage.py -v

  test-macos:
    # The plugin actually runs on macOS under the system interpreter, so
    # exercise that exact combination rather than a managed Python.
    name: test (macOS system python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: /usr/bin/python3 -m unittest test_claude_usage.py -v
